name: Chasse aux concours

on:
  schedule:
    - cron: "7 6,11,17 * * *"   # environ 7h, 12h et 18h (heure de Paris en hiver)
  workflow_dispatch:
    inputs:
      sonde:
        description: "Enregistrer les pages brutes des sites (diagnostic)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chasse
  cancel-in-progress: false

jobs:
  chasse:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Diagnostic (pages brutes)
        if: ${{ inputs.sonde }}
        run: python outils/sonde.py

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.sonde }}
        with:
          name: sonde
          path: sonde/
          retention-days: 3

      - name: Chercher les concours
        run: python agent.py --publier
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SEUIL: "300"
          URL_TABLEAU: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Sauvegarder la mémoire de l'agent
        run: |
          git config user.name "chasseur-bot"
          git config user.email "chasseur-bot@users.noreply.github.com"
          git add data/concours.db data/journal.txt web/concours.json
          git diff --cached --quiet || git commit -m "Chasse du $(date +'%d/%m %Hh%M')" && git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploiement
        uses: actions/deploy-pages@v4
